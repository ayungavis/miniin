name: Miniin

options:
  bundleIdPrefix: com.miniin
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  minimumXcodeGenVersion: "2.46.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  MiniinKit:
    path: ../../packages/MiniinKit

targets:
  Miniin:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Miniin
    dependencies:
      - package: MiniinKit
        product: MiniinKit
      - framework: ../../vendor/ffmpeg/FFmpeg.xcframework
        embed: true
        codeSign: true
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Miniin/Info.plist
      properties:
        CFBundleDisplayName: Miniin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, id]
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.video
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        MiniinEnvironment: $(MINIIN_ENVIRONMENT)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        SWIFT_OBJC_BRIDGING_HEADER: Miniin/Miniin-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"

schemes:
  Miniin:
    build:
      targets:
        Miniin: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
